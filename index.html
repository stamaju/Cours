<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:2.2rem;line-height:1.05;margin:0 0 12px;font-weight:800;letter-spacing:-.03em}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.lg button{font:inherit;font-weight:600;font-size:.85rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:9px;cursor:pointer;margin-left:4px}
.lg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.price{font-size:2rem;font-weight:800;margin:0 0 10px}.lock{opacity:.6}

input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.note{font-size:.85rem;color:var(--mut)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
@media print{body{display:none!important}}
button.vid{font:inherit;width:100%;border:0;text-align:left;cursor:pointer}
.stage{border-radius:18px;min-height:300px;padding:24px 20px;color:#fff;background:linear-gradient(135deg,#2f5bff,#7a3cff,#ff5fa2);background-size:300% 300%;animation:bg 8s ease infinite;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.stage .ic{font-size:4rem;animation:pop .6s ease both}@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.stage h2{animation:up .6s .1s ease both}.stage p{font-size:1.1rem;animation:up .7s .4s ease both}@keyframes up{from{transform:translateY(16px);opacity:0}}
.vc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.vc .btn{padding:9px 14px}
.pb{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:var(--acc2)}
.wm{position:fixed;inset:-50%;pointer-events:none;z-index:50;opacity:.06;font-weight:800;line-height:3;transform:rotate(-25deg);overflow:hidden;word-spacing:40px}
@media (prefers-reduced-motion:reduce){.stage,.stage *{animation:none!important}}
</style>
</head>

let S={};try{S=JSON.parse(localStorage.getItem("iaN2")||"{}")}catch(e){}
S.done=S.done||[];let PAID=null;
if(!S.lang){const n=(navigator.language||"fr").slice(0,2);S.lang=n==="en"?"en":n==="ht"?"ht":"fr"}
const save=()=>{try{localStorage.setItem("iaN2",JSON.stringify(S))}catch(e){}};
function detect(){let z="",l=navigator.language||"fr";try{z=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
if(/Port-au-Prince/.test(z)||/^ht/i.test(l))return"HT";
if(/^America\/(Toronto|Montreal|Vancouver|Halifax|Winnipeg|Edmonton)/.test(z))return"CA";
if(/^America\//.test(z))return"US";if(/^Europe\//.test(z))return"FR";if(/^Africa\//.test(z))return"AF";return"XX"}
const $=document.getElementById("app"),T=()=>L[S.lang].u,N=i=>i===0?L[S.lang].m[0]:PAID&&PAID[S.lang][i-1],TI=i=>T().titles[i];
const locked=i=>i>0&&!PAID;
let V=home,cur=0,step=0,qi=0,score=0,ans=false;
const country=()=>S.hc||(S.hc="HT");

function hdr(back){const t=T();return`<div class="top">${back?`<button class="btn g" id="bk">${t.back}</button>`:"<span></span>"}<span class="lg">${["fr","en","ht"].map(k=>`<button class="${S.lang===k?"on":""}" data-l="${k}">${k.toUpperCase()}</button>`).join("")}</span></div>`}
function bind(){$.querySelectorAll(".lg button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;document.documentElement.lang=S.lang==="ht"?"ht":S.lang;save();V()});
const b=document.getElementById("bk");if(b)b.onclick=home}
function vidLink(){const k=cur+"-"+S.lang,t=VT[S.lang];return`<button class="vid" id="pv"><b>▶</b><span><b style="display:block;width:auto;height:auto;background:none;color:#fff;font-size:1rem">${t.watch}</b><span style="opacity:.8;font-size:.85rem">${t.sub}</span></span></button>`+(VIDEOS[k]?`<a class="vid" href="${VIDEOS[k]}" target="_blank" rel="noopener"><b>🎬</b><span>${T().vid}</span></a>`:"")}
function vidLinkOld(){const k=cur+"-"+S.lang,sf={fr:"IA débutant",en:"AI for beginners",ht:"IA kreyòl"}[S.lang];
const u=VIDEOS[k]||"https://www.youtube.com/results?search_query="+encodeURIComponent(N(cur)[0]+" "+sf);
return`<a class="vid" href="${u}" target="_blank" rel="noopener"><b>▶</b><span><b style="display:block;width:auto;height:auto;background:none;color:#fff;font-size:1rem">${T().vid}</b><span style="opacity:.8;font-size:.85rem">${T().vidn}</span></span></a>`}

function home(){V=home;const t=T(),n=S.done.length,P=C[country()].p;
$.innerHTML=hdr(0)+`<div class="hero"><span class="tag">${t.tag}</span><h1>${t.h}</h1><p>${t.sub}</p>${PAID?"":`<p class="price">${P}</p><button class="btn y" id="buy">${t.buy}</button><p style="margin:10px 0 0;font-size:.85rem">${t.free}</p>`}</div>
<h2>${t.path}</h2><p class="mut">${n}/7</p>
${[0,1,2,3,4,5,6].map(i=>`<button class="card mod ${locked(i)?"lock":""}" data-i="${i}"><span class="em">${locked(i)?"🔒":E[i]}</span><div><h3>${t.mod} ${i+1} · ${TI(i)}</h3><span class="mut">${S.done.includes(i)?t.done:i===0?t.gratis:"▶ "+t.c}</span><div class="bar"><i style="width:${S.done.includes(i)?100:0}%"></i></div></div></button>`).join("")}
${n===7?`<div class="card"><h2>${t.bravo}</h2><p>${t.cd}</p><input id="nm" placeholder="${t.nm}" maxlength="40"><button class="btn" id="cert">${t.getc}</button></div>`:""}`;
bind();
$.querySelectorAll(".mod").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(locked(i))pay();else{cur=i;step=0;qi=0;score=0;lesson()}});
const by=document.getElementById("buy");if(by)by.onclick=pay;
const c=document.getElementById("cert");if(c)c.onclick=()=>{const v=document.getElementById("nm").value.trim();v?certif(v):document.getElementById("nm").focus()}}

function pay(){V=pay;const t=T(),c=country(),d=C[c];if(!d.m.includes(S.pm))S.pm=d.m[0];
const lab=k=>k==="card"?t.card:MN[k],v=PAY[S.pm]||"",isU=/^https?:/.test(v),P2=PT[S.lang],wa="https://wa.me/"+WA+"?text="+encodeURIComponent(P2.msg+" "+d.p+" · "+lab(S.pm));
$.innerHTML=hdr(1)+`<h2>${t.pay}</h2><div class="card"><p class="price">${d.p}</p><label class="mut">${t.country}</label><select id="ct">${Object.keys(C).map(k=>`<option value="${k}" ${k===c?"selected":""}>${t.cn[k]}</option>`).join("")}</select><label class="mut">${t.method}</label>${d.m.map(k=>`<button class="opt ${k===S.pm?"on":""}" data-m="${k}">${lab(k)}</button>`).join("")}
<p>${isU?`<a class="btn" href="${v}" target="_blank" rel="noopener">${t.payb}</a>`:v?`${t.send} <b>${v}</b>`:`<span class="note">${t.notset}</span>`}</p>
</div><div class="card"><h3>${P2.step}</h3>${WA?`<a class="btn" href="${wa}" target="_blank" rel="noopener">${P2.wa}</a><p class="note" style="margin:10px 0">${P2.nwa}</p>`:""}<input id="cd" placeholder="${P2.code}" autocomplete="off"><button class="btn y" id="rd">${P2.go}</button><p class="note" id="rm"></p></div>`;

try{const r=await fetch("/api/redeem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:v,device:DEV})});const j=await r.json();if(!r.ok)throw 0;S.tok=j.token;S.code=j.id;save();await loadPaid();home()}catch(e){m.textContent=P2.bad}}}

function lesson(){V=lesson;const t=T(),m=N(cur),l=m[1][step];
$.innerHTML=hdr(1)+`<h2>${E[cur]} ${m[0]}</h2>${vidLink()}<div class="card"><p class="mut">${t.les} ${step+1}/3</p><h3>${l[0]}</h3><p>${l[1]}</p></div><button class="btn" id="nx">${step<2?t.nxt:t.toq}</button>`;
bind();const pv=document.getElementById("pv");if(pv)pv.onclick=()=>video(0);document.getElementById("nx").onclick=()=>{if(step<2){step++;lesson()}else{qi=0;score=0;quiz()}}}

function quiz(){V=quiz;const t=T(),Q=N(cur)[2];if(qi>=Q.length)return fin();const q=Q[qi];ans=false;
$.innerHTML=hdr(1)+`<h2>${t.q} ${qi+1}/${Q.length}</h2><div class="card"><h3>${q[0]}</h3></div>${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}<div id="fb"></div>`;

function scenes(){const m=N(cur),t=VT[S.lang];return[{h:m[0],p:T().h,i:E[cur]},...m[1].map((l,k)=>({h:l[0],p:l[1],i:["💡","🔎","✅"][k]})),{h:t.end,p:t.endp,i:"🎯"}]}
const dur=s=>3200+(vvo?75:50)*s.p.length;
function speak(){try{speechSynthesis.cancel();if(!vvo||!vpl)return;const s=scenes()[vs],u=new SpeechSynthesisUtterance(s.h+". "+s.p);u.lang=VT[S.lang].sp;u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function video(s,keep){V=video;if(typeof s==="number"){vs=s;vel=0;vpl=true}
const t=VT[S.lang],sc=scenes(),c=sc[vs],last=sc.length-1;
$.innerHTML=hdr(1)+`<div class="stage" role="img"><div class="ic">${c.i}</div><h2>${c.h}</h2><p>${c.p}</p></div><div class="pb"><i style="width:${(vs+Math.min(1,vel/dur(c)))/sc.length*100}%"></i></div><div class="vc"><button class="btn g" id="pv0">⏮</button><button class="btn" id="pp">${vpl?"⏸ "+t.pause:"▶ "+t.play}</button><button class="btn g" id="pv1">⏭</button><button class="btn g" id="vo">🔊 ${t.voice}: ${vvo?"ON":"OFF"}</button></div><div class="row">${vs===last?`<button class="btn y" id="gq">${t.quiz}</button>`:""}<button class="btn g" id="gl">${t.lessons}</button></div>`;
bind();if(!keep)speak();
const go=n=>{vs=Math.max(0,Math.min(last,n));vel=0;vpl=true;video()};
document.getElementById("pv0").onclick=()=>go(vs-1);document.getElementById("pv1").onclick=()=>go(vs+1);
document.getElementById("pp").onclick=()=>{if(vpl){vpl=false;try{speechSynthesis.cancel()}catch(e){}video(undefined,true)}else{if(vel>=dur(c)){vs=vs===last?0:vs;vel=0}vpl=true;video()}};
document.getElementById("vo").onclick=()=>{vvo=!vvo;video()};
document.getElementById("gl").onclick=()=>{step=0;lesson()};
const gq=document.getElementById("gq");if(gq)gq.onclick=()=>{qi=0;score=0;quiz()};
clearInterval(vt);vt=setInterval(()=>{if(V!==video){clearInterval(vt);try{speechSynthesis.cancel()}catch(e){}return}
if(!vpl)return;vel+=100;const d=dur(sc[vs]),pg=$.querySelector(".pb i");if(pg)pg.style.width=(vs+Math.min(1,vel/d))/sc.length*100+"%";
if(vel>=d){if(vs<last)go(vs+1);else{vpl=false;video(undefined,true)}}},100)}
(function(){["contextmenu","copy","cut","dragstart","selectstart"].forEach(n=>document.addEventListener(n,e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName||""))e.preventDefault()}));
document.addEventListener("keydown",e=>{const k=(e.key||"").toLowerCase();if(e.key==="F12"||((e.ctrlKey||e.metaKey)&&(["s","u","p","c","a"].includes(k)||(e.shiftKey&&["i","j","c"].includes(k)))))e.preventDefault()});
let id="ID-"+Math.random().toString(36).slice(2,8).toUpperCase();try{id=localStorage.getItem("iaID")||id;localStorage.setItem("iaID",id)}catch(e){}
const w=document.createElement("div");w.className="wm";w.setAttribute("aria-hidden","true");w.textContent=Array(200).fill("© "+id).join(" ");document.body.appendChild(w);
const f=document.createElement("p");f.className="note";f.style.cssText="text-align:center;margin:24px 16px";f.textContent="© 2026 · Licence personnelle "+id+" · Reproduction interdite";document.body.appendChild(f)})();
function certif(n){V=()=>certif(n);const t=T(),d=new Date().toLocaleDateString({fr:"fr-FR",en:"en-US",ht:"fr-FR"}[S.lang],{day:"numeric",month:"long",year:"numeric"});
$.innerHTML=hdr(1)+`<div class="cert"><p class="mut">${t.ct}</p><h2>${t.h}</h2><p>${t.to}</p><h1 id="who" style="font-size:1.9rem"></h1><p>${t.fin}</p><p class="mut">${d}</p></div><p class="note" style="text-align:center;margin-top:12px">${t.shot}</p>`;
document.getElementById("who").textContent=n;bind()}
const PT={fr:{step:"Après paiement",wa:"Envoyer la preuve par WhatsApp",nwa:"Nous vous répondons avec votre code d’accès personnel.",code:"Votre code d’accès (IA-XXXXXXXX)",go:"Activer mon accès",bad:"Code invalide ou limite d’appareils atteinte.",msg:"Bonjour, j’ai payé le cours IA :"},
en:{step:"After payment",wa:"Send proof on WhatsApp",nwa:"We reply with your personal access code.",code:"Your access code (IA-XXXXXXXX)",go:"Activate my access",bad:"Invalid code or device limit reached.",msg:"Hello, I paid for the AI course:"},
ht:{step:"Apre peman",wa:"Voye prèv la sou WhatsApp",nwa:"N ap reponn ou ak kòd aksè pèsonèl ou.",code:"Kòd aksè ou (IA-XXXXXXXX)",go:"Aktive aksè m",bad:"Kòd pa valab oswa limit aparèy la rive.",msg:"Bonjou, mwen peye kou IA a :"}};
async function loadPaid(){try{const r=await fetch("/api/content?t="+encodeURIComponent(S.tok||""));if(!r.ok){if(r.status===403){S.tok=null;save()}throw 0}PAID=await r.json();const w=document.querySelector(".wm");if(w&&S.code)w.textContent=Array(200).fill("© "+S.code).join(" ")}catch(e){PAID=null}}
if(S.tok)loadPaid().then(()=>V===home&&home());
home();
